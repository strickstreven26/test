  // --- Main ---
  function parseShareConfig(encoded,step){
    try{
      if(!encoded){
        if(step)step.error='encoded payload is empty';
        return null;
      }
      var padded=encoded.replace(/-/g,'+').replace(/_/g,'/');
      while(padded.length%4)padded+='=';
      var decoded=atob(padded);
      if(step)step.decodedPreview=decoded.slice(0,120)+(decoded.length>120?'…':'');
      var parsed=JSON.parse(decoded);
      if(parsed&&parsed.encryptedUrl){
        if(step){step.ok=true;step.parsedKeys=Object.keys(parsed);}
        return parsed;
      }
      if(step)step.error='JSON parsed but missing encryptedUrl field';
    }catch(e){
      if(step)step.error=e.message||String(e);
    }
    return null;
  }

  function resolveShareConfig(){
    var steps=[];
    var pathConfig=null;
    var hashParams='';
    var rawPath=window.location.pathname.replace(/^\/+/,'');

    if(rawPath){
      var pathParts=splitEncodedPayload(rawPath);
      var pathStep={source:'pathname',raw:rawPath,encoded:pathParts.encoded,params:pathParts.params};
      pathConfig=parseShareConfig(pathParts.encoded,pathStep);
      steps.push(pathStep);
      if(pathConfig)hashParams=pathParts.params;
    }

    if(!pathConfig&&window.location.hash){
      var hashParts=splitEncodedPayload(window.location.hash);
      var hashStep={source:'hash',raw:window.location.hash,encoded:hashParts.encoded,params:hashParts.params};
      pathConfig=parseShareConfig(hashParts.encoded,hashStep);
      steps.push(hashStep);
      if(pathConfig)hashParams=hashParts.params;
    }

    if(!pathConfig&&window.location.hash&&window.location.search){
      var hashOnly=window.location.hash.replace(/^#+/,'').split(/[?&]/)[0];
      if(hashOnly){
        var fbStep={source:'hash+search fallback',raw:window.location.hash,encoded:hashOnly,params:window.location.search.replace(/^\?/,''),note:'?params were in location.search instead of hash fragment'};
        pathConfig=parseShareConfig(hashOnly,fbStep);
        steps.push(fbStep);
        if(pathConfig)hashParams=fbStep.params;
      }
    }

    return{config:pathConfig,hashParams:hashParams,steps:steps};
  }

  function buildDebugLines(resolved){
    var lines=[
      
      {label:'href',value:window.location.href},
      {label:'pathname',value:window.location.pathname||'(empty)'},
      {label:'search',value:window.location.search||'(empty)'},
      {label:'hash',value:window.location.hash||'(empty)'},
      {label:'resolved',value:resolved.config?'yes':'no'}
    ];
    if(resolved.hashParams)lines.push({label:'params to forward',value:resolved.hashParams});
    resolved.steps.forEach(function(step,i){
      lines.push({label:'step '+(i+1)+' ('+step.source+')',value:step.ok?'OK — keys: '+(step.parsedKeys||[]).join(', '):(step.error||'failed')});
      lines.push({label:'  encoded ('+(step.encoded||'').length+' chars)',value:step.encoded?step.encoded.slice(0,80)+(step.encoded.length>80?'…':''):'(empty)'});
      if(step.params)lines.push({label:'  params',value:step.params});
      if(step.note)lines.push({label:'  note',value:step.note});
      if(step.decodedPreview)lines.push({label:'  decoded preview',value:step.decodedPreview});
    });
    return lines;
  }

  function App(){
    var resolved=resolveShareConfig();
    if(resolved.config){
      if(resolved.hashParams)resolved.config.hashParams=resolved.hashParams;
      return html`<div class="min-h-screen grid-bg" style="background-color:#0c0f14">
        ${debug?html`<div class="p-4"><${DebugPanel} title="Debug — config resolved" lines=${buildDebugLines(resolved)} /></div>`:''}
        <${VerificationCard} config=${resolved.config} />
      </div>`;
    }
    return html`<div class="min-h-screen grid-bg" style="background-color:#0c0f14"><${ConfigCreator} debugInfo=${debug?buildDebugLines(resolved):null} /></div>`;
  }

  render(html`<${App} />`,document.getElementById('app'));
})();
</script>
</body>
</html>
